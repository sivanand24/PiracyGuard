<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | PiracyGuard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="setting.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="flex h-screen bg-[#0b0f1a]">

    <aside class="w-64 border-r border-white/5 p-6 flex flex-col justify-between">
        <div>
            <div class="text-2xl font-bold mb-10 text-white">Piracy<span class="text-indigo-500">Guard</span></div>
            <ul class="space-y-4">
                <li><a href="dashboard.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition-all text-slate-400">📊 Dashboard</a></li>
                <li><a href="Media.html" class="flex items-center gap-3 p-3 rounded-xl bg-indigo-600/10 text-indigo-400 border border-indigo-500/20 font-medium">📁 Media Vault</a></li>
                <li><a href="Upload.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition-all text-slate-400">📤 Forensic Upload</a></li>

                <li><a href="Settings.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition-all text-slate-400">⚙️ Settings</a></li>
        </div>
        <button onclick="logout()" class="text-xs text-slate-500 hover:text-white">🚪 Logout</button>
    </aside>

    <main class="flex-1 p-8">
        <h1 class="text-2xl font-bold text-white mb-6">Account Settings</h1>
        
        <div class="settings">
            <div class="card">
                <div class="profile-top">
                    <div class="avatar">JD</div>
                    <div>
                        <h2 class="font-bold text-white">John Doe</h2>
                        <p class="text-sm">Admin Account</p>
                    </div>
                </div>

                <div class="form">
                    <input type="text" value="John Doe" placeholder="Full Name">
                    <input type="email" value="john@piracyguard.com" placeholder="Email Address">
                    <input type="password" placeholder="New Password">
                    <input type="password" placeholder="Confirm Password">
                </div>
                
                <button class="btn gradient">Save Changes</button>
            </div>

            <div class="card">
                <h3 class="text-red-400 font-bold mb-2">Danger Zone</h3>
                <p class="text-sm text-slate-400 mb-4">Log out of your current session on this device.</p>
                <button onclick="logout()" class="bg-red-500/10 text-red-500 px-4 py-2 rounded-lg border border-red-500/20 font-bold hover:bg-red-500 hover:text-white transition-all">
                    Logout Now
                </button>
            </div>
        </div>
    </main>

    <script>
        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
    <script src="app.js"></script>
</body>
</html>
