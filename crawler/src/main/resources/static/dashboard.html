<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        localStorage.setItem('user', JSON.stringify({ 
    username: "DemoUser", 
    email: "demo@piracyguard.com" 
     }));
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiracyGuard | Intelligence Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .glass-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-[#0b0f1a] text-slate-300 h-screen overflow-hidden flex">

    <aside class="w-64 border-r border-white/5 p-6 flex flex-col justify-between">
        <div>
            <div class="logo font-['Syne'] text-2xl font-bold mb-10 text-white">Piracy<span class="text-indigo-500">Guard</span></div>
            <ul class="space-y-4">
                <li><a href="dashboard.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition-all text-slate-400">📊 Dashboard</a></li>

                <li><a href="Media.html" class="flex items-center gap-3 p-3 rounded-xl bg-indigo-600/10 text-indigo-400 border border-indigo-500/20 font-medium">📁 Media Vault</a></li>
                <li><a href="Upload.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition-all text-slate-400">📤 Forensic Upload</a></li>
                <li><a href="Settings.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition-all text-slate-400">⚙️ Settings</a></li>
            </ul>
        </div>
        <button onclick="localStorage.clear(); location.href='login.html'" class="text-xs text-slate-500 hover:text-white">🚪 Logout</button>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        <header class="mb-8">
            <h1 class="text-2xl font-bold text-white font-['Syne']">Discovery Engine</h1>
            <p class="text-slate-500 text-sm">Targeted intelligence for sports piracy monitoring.</p>
        </header>

        <div class="max-w-3xl mx-auto"> 
            <div class="glass-panel p-6">
                <h3 class="text-xs font-bold uppercase text-indigo-400 mb-4">Find New Piracy Links</h3>
                <div class="flex gap-3">
                    <input id="searchInput" class="bg-white/5 border border-white/10 rounded-lg p-3 text-white flex-1 focus:outline-none focus:border-indigo-500" placeholder="Enter event name (e.g., Lakers vs Bulls)...">
                    <button onclick="performSearch()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-lg font-semibold transition-all">
                        Search
                    </button>
                </div>
            </div>

            <div id="resultsWrapper" class="mt-6 glass-panel p-6 hidden">
                <h3 class="text-xs font-bold uppercase text-emerald-400 mb-4">Discovery Results</h3>
                <ul id="results" class="space-y-3"></ul>
            </div>
        </div>
    </main>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
