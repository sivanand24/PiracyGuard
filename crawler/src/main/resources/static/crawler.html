<div class="crawler-container">

    <h2>Web Piracy Crawler</h2>

    <!-- Input Form -->
    <div class="card">
        <input type="text" id="seedUrl" placeholder="Enter Seed URL">
        <input type="text" id="mediaTitle" placeholder="Enter Media Title">
        <button onclick="startCrawler()">Start Crawl</button>
    </div>

    <!-- Logs -->
    <div class="card">
        <h3>Live Logs</h3>
        <div id="logs"></div>
    </div>

    <!-- Results -->
    <div class="card">
        <h3>Detected Links</h3>
        <ul id="results"></ul>
    </div>

</div>
